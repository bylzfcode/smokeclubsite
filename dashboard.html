<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Escritório — Painel Compartilhado</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@600;700;800;900&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<style>
:root{
  --red:#E3132B; --red-dark:#A80D1F; --ink:#141416; --ink-2:#1E1E22;
  --bg:#F4F4F6; --card:#FFFFFF; --line:#E4E4E9; --soft:#FAFAFB;
  --text:#1B1B1F; --muted:#6E6E78; --green:#1FAF55; --green-bg:#E6F9EE; --amber-bg:#FFF1CE; --amber:#7A6215; --red-bg:#FDE8EA;
  --radius:12px; --shadow:0 2px 10px rgba(20,20,22,.07); --shadow-lg:0 12px 34px rgba(20,20,22,.18);
}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Inter',system-ui,sans-serif;background:var(--bg);color:var(--text);-webkit-font-smoothing:antialiased}
button{font-family:inherit;cursor:pointer}
input,select,textarea{font-family:inherit}
.hidden{display:none!important}
h1,h2,h3{font-family:'Archivo',sans-serif;font-weight:800;letter-spacing:-.01em}
button:disabled{opacity:.5;cursor:not-allowed}

/* login / seletor */
.fullscreen{position:fixed;inset:0;background:linear-gradient(135deg,var(--ink),#33161a 60%,var(--red-dark));display:flex;align-items:center;justify-content:center;padding:20px;overflow-y:auto}
.login-box{max-width:390px;width:100%;background:var(--card);border-radius:18px;padding:34px 30px;box-shadow:var(--shadow-lg)}
.login-logo{font-size:1.55rem;font-weight:900;text-align:center;margin-bottom:4px;font-family:'Archivo',sans-serif}
.login-sub{text-align:center;color:var(--muted);font-size:.84rem;margin-bottom:22px}
.login-foot{text-align:center;color:var(--muted);font-size:.68rem;margin-top:16px}
.field{width:100%;padding:12px 14px;border-radius:10px;border:1.5px solid var(--line);background:var(--soft);font-size:15px;color:var(--text);margin-bottom:10px}
.field:focus{outline:none;border-color:var(--red);background:#fff}
textarea.field{resize:vertical;min-height:70px}
.btn{border:none;border-radius:10px;padding:13px;font-weight:700;font-size:.92rem;width:100%}
.btn-red{background:var(--red);color:#fff}
.btn-red:hover:not(:disabled){background:var(--red-dark)}
.btn-soft{background:#F1F1F4;color:var(--text);border:1px solid var(--line)}
.login-err{color:var(--red);font-size:.82rem;margin-bottom:10px;text-align:center;min-height:1em}
.loja-card{width:100%;text-align:left;background:var(--soft);border:1.5px solid var(--line);border-radius:12px;padding:16px;margin-bottom:10px;font-weight:700;font-size:.95rem;display:flex;align-items:center;gap:12px}
.loja-card:hover{border-color:var(--red);background:var(--red-bg)}
.loja-card .ic{font-size:1.4rem}

/* shell */
#app{min-height:100vh;flex-direction:column;display:none}
#app.show{display:flex}
header.top{background:var(--ink);color:#fff;padding:10px 16px;display:flex;align-items:center;gap:10px;flex-wrap:wrap;box-shadow:0 2px 12px rgba(0,0,0,.25);position:sticky;top:0;z-index:50}
header.top .brand{font-weight:900;font-size:1.05rem;font-family:'Archivo',sans-serif}
.loja-chip{background:var(--ink-2);border:1px solid #333338;border-radius:999px;padding:6px 13px;font-size:.78rem;font-weight:700;display:flex;align-items:center;gap:7px}
.live-dot{width:8px;height:8px;border-radius:50%;background:#888}
.live-dot.on{background:#25D366;animation:pulse 1.8s ease infinite}
.live-dot.off{background:var(--red)}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(37,211,102,.5)}70%{box-shadow:0 0 0 7px rgba(37,211,102,0)}100%{box-shadow:0 0 0 0 rgba(37,211,102,0)}}
header.top .spacer{flex:1}
header.top button{background:var(--ink-2);border:1px solid #333;color:#fff;border-radius:9px;padding:8px 12px;font-weight:700;font-size:.78rem}
nav.tabs{background:var(--card);border-bottom:1px solid var(--line);display:flex;gap:2px;overflow-x:auto;padding:0 10px;scrollbar-width:none;position:sticky;top:52px;z-index:45}
nav.tabs::-webkit-scrollbar{display:none}
.tabbtn{flex-shrink:0;background:none;border:none;padding:13px 13px 11px;font-size:.84rem;font-weight:700;color:var(--muted);border-bottom:2.5px solid transparent;white-space:nowrap}
.tabbtn.active{color:var(--red);border-bottom-color:var(--red)}
main{flex:1;padding:16px 14px 70px}
.wrap{max-width:980px;margin:0 auto}
.page-h{display:flex;align-items:center;gap:10px;margin-bottom:12px;flex-wrap:wrap}
.page-h h2{font-size:1.15rem;flex:1}

/* kpis & cards */
.kpi-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:14px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px 15px;box-shadow:var(--shadow)}
.kpi .v{font-family:'Archivo',sans-serif;font-weight:900;font-size:1.45rem;line-height:1.1}
.kpi .l{font-size:.72rem;color:var(--muted);margin-top:5px;font-weight:600}
.kpi.warn .v{color:var(--red)}.kpi.good .v{color:var(--green)}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:15px;margin-bottom:12px;box-shadow:var(--shadow)}
.card h3{font-size:.95rem;margin-bottom:10px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.row>.grow{flex:1;min-width:120px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:0 10px}
@media(max-width:560px){.grid2{grid-template-columns:1fr}}
label{display:block;font-size:.74rem;font-weight:700;color:var(--muted);margin:8px 0 4px}
.two-col{display:grid;grid-template-columns:1.1fr .9fr;gap:12px;align-items:start}
@media(max-width:800px){.two-col{grid-template-columns:1fr}}

/* chart */
.bars{display:flex;align-items:flex-end;gap:8px;height:130px;padding-top:8px}
.bar{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;font-size:.66rem;color:var(--muted)}
.bar i{display:block;width:100%;background:var(--red);border-radius:6px 6px 0 0;min-height:2px}
.bar i.zero{background:var(--line)}
.bar b{font-size:.66rem;color:var(--text);margin-bottom:3px}

/* stock */
.grupo-h{font-size:.76rem;font-weight:800;color:var(--muted);letter-spacing:.05em;margin:16px 0 6px;text-transform:uppercase}
.item-row{display:flex;align-items:center;gap:10px;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:9px 12px;margin-bottom:6px}
.item-row.click{cursor:pointer}.item-row.click:hover{border-color:var(--red)}
.item-row .ic{font-size:1.3rem;width:30px;text-align:center;flex-shrink:0}
.item-row .in{flex:1;min-width:0}
.item-row .in b{font-size:.85rem;display:block;overflow-wrap:anywhere}
.item-row .in small{color:var(--muted);font-size:.71rem}
.qtd-badge{font-family:'Archivo',sans-serif;font-weight:900;font-size:1rem;padding:3px 10px;border-radius:8px;background:#EEEEF2;min-width:40px;text-align:center}
.qtd-badge.baixo{background:var(--amber-bg);color:var(--amber)}
.qtd-badge.zero{background:var(--red-bg);color:var(--red)}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
.chip{padding:7px 13px;border-radius:999px;border:1.5px solid var(--line);background:var(--soft);font-size:.78rem;font-weight:700;color:var(--muted)}
.chip.sel{background:var(--ink);border-color:var(--ink);color:#fff}

/* sale */
.cart-item{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--line)}
.cart-item .ci-info{flex:1;font-size:.85rem;min-width:0;overflow-wrap:anywhere}
.cart-item .ci-info small{color:var(--muted);display:block;font-size:.72rem}
.qty{display:flex;align-items:center;gap:4px}
.qty button{width:28px;height:28px;border:1px solid var(--line);background:#fff;border-radius:7px;font-weight:800}
.qty span{min-width:24px;text-align:center;font-weight:800;font-size:.9rem}
.sel-result{padding:9px 12px;border:1px solid var(--line);border-radius:9px;margin-bottom:5px;cursor:pointer;display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:.84rem;background:#fff}
.sel-result:hover{border-color:var(--red);background:var(--red-bg)}
.sel-result.off{opacity:.55;cursor:not-allowed}.sel-result.off:hover{border-color:var(--line);background:#fff}
.sel-result small{color:var(--muted);display:block;font-size:.71rem}
.tt-row{display:flex;justify-content:space-between;font-size:.88rem;padding:4px 0;color:var(--muted)}
.tt-row.big{border-top:1px solid var(--line);margin-top:8px;padding-top:10px;font-weight:800;color:var(--text);font-size:1.1rem}

/* lists */
.list-row{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line);font-size:.85rem}
.list-row:last-child{border-bottom:none}
.list-row.click{cursor:pointer}.list-row.click:hover{background:var(--soft)}
.list-row .grow{flex:1;min-width:0;overflow-wrap:anywhere}
.list-row small{color:var(--muted);display:block;font-size:.72rem}
.tag{font-size:.66rem;font-weight:800;padding:3px 9px;border-radius:999px;white-space:nowrap}
.tag.entrada,.tag.pago,.tag.concluida{background:var(--green-bg);color:#1a7a40}
.tag.saida,.tag.atrasado,.tag.cancelada{background:var(--red-bg);color:var(--red)}
.tag.pendente{background:var(--amber-bg);color:var(--amber)}
.tag.parcial{background:#E3F0FF;color:#1B4F8F}
.tag.neutro{background:#EEEEF2;color:var(--muted)}
.abtn{border:none;border-radius:8px;padding:9px 14px;font-weight:700;font-size:.8rem}
.abtn.red{background:var(--red);color:#fff}.abtn.dark{background:var(--ink);color:#fff}
.abtn.soft{background:#F1F1F4;color:var(--text);border:1px solid var(--line)}.abtn.green{background:var(--green);color:#fff}
.abtn.sm{padding:6px 10px;font-size:.74rem}
.empty{text-align:center;color:var(--muted);padding:28px 0;font-size:.88rem}
.neg{color:var(--red)}.pos{color:var(--green)}
#waPreview{white-space:pre-wrap;font-size:.83rem;line-height:1.6;background:var(--soft);border:1px solid var(--line);border-radius:10px;padding:14px;max-height:440px;overflow-y:auto}
.check{display:flex;align-items:center;gap:8px;font-size:.84rem;font-weight:600;margin:6px 0}
.check input{width:18px;height:18px}

#toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%) translateY(16px);z-index:600;background:var(--ink);color:#fff;font-size:.84rem;font-weight:600;padding:11px 20px;border-radius:999px;opacity:0;pointer-events:none;transition:all .25s;box-shadow:var(--shadow-lg);max-width:90vw;text-align:center}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
#toast.err{background:var(--red)}
.modal-ov{position:fixed;inset:0;background:rgba(14,14,16,.55);z-index:200;display:none;align-items:center;justify-content:center;padding:16px}
.modal-ov.show{display:flex}
.modal-box{background:var(--card);border-radius:16px;padding:22px;max-width:460px;width:100%;max-height:88vh;overflow-y:auto;box-shadow:var(--shadow-lg)}
.modal-box h3{margin-bottom:12px}
.modal-box.wide{max-width:680px}
.modal-actions{display:flex;gap:8px;margin-top:14px}.modal-actions button{flex:1}
.aviso{border:1px solid var(--line);border-left:5px solid #7A8AA0;border-radius:10px;padding:10px 12px;margin-bottom:8px;background:#fff;display:flex;gap:10px;align-items:flex-start}
.aviso.atencao{border-left-color:#D9A400;background:#FFFBEC}.aviso.urgente{border-left-color:var(--red);background:#FFF5F6}
.aviso.destaque{box-shadow:0 0 0 2px rgba(227,19,43,.25)}
.aviso .tx{flex:1;min-width:0;overflow-wrap:anywhere;font-size:.84rem}.aviso .tx b{display:block;font-size:.88rem}
.aviso .tx small{display:block;color:var(--muted);font-size:.7rem;margin-top:3px}
.aviso.lido{opacity:.62}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--red);margin-right:6px}
.dia-row{border:1px solid var(--line);border-radius:10px;background:#fff;margin-bottom:8px;overflow:hidden}
.dia-h{display:flex;gap:10px;align-items:center;padding:11px 12px;cursor:pointer;flex-wrap:wrap}
.dia-h .grow{flex:1;min-width:150px}
.dia-nums{display:grid;grid-template-columns:repeat(auto-fit,minmax(92px,1fr));gap:6px;width:100%;font-size:.74rem}
.dia-nums span{display:block;color:var(--muted)}.dia-nums b{font-size:.84rem}
.dia-det{border-top:1px solid var(--line);padding:10px 12px;background:var(--soft)}
.banner{background:var(--amber-bg);color:var(--amber);border-radius:10px;padding:9px 12px;font-size:.8rem;font-weight:600;margin-bottom:12px}
</style>
</head>
<body>

<div id="loginScreen" class="fullscreen">
  <form class="login-box" id="loginForm" autocomplete="on">
    <div class="login-logo">Escritório</div>
    <div class="login-sub">Painel Compartilhado</div>
    <div class="login-err" id="loginErr" role="alert"></div>
    <input class="field" id="loginUsuario" type="text" placeholder="User" autocomplete="username" autocapitalize="none" spellcheck="false">
    <input class="field" id="loginSenha" type="password" placeholder="Senha" autocomplete="current-password">
    <button class="btn btn-red" id="btnLogin" type="submit">Entrar</button>
    <div class="login-foot" id="loginFoot"></div>
  </form>
</div>

<div id="seletorLoja" class="fullscreen hidden">
  <div class="login-box">
    <div class="login-logo" style="font-size:1.2rem">Escolha a loja</div>
    <div class="login-sub" id="seletorSub">—</div>
    <div id="seletorCards"></div>
    <button class="btn btn-soft" data-a="logout" style="margin-top:6px">Sair</button>
  </div>
</div>

<div id="app">
  <header class="top">
    <div class="brand">Escritório</div>
    <span class="loja-chip"><span class="live-dot" id="liveDot" title="Tempo real"></span><span id="lojaNomeChip">—</span></span>
    <button id="btnTrocarLoja" class="hidden" data-a="trocarLoja">🔄 Trocar loja</button>
    <div class="spacer"></div>
    <button data-a="logout">Sair</button>
  </header>
  <nav class="tabs" id="tabsNav"></nav>
  <main><div class="wrap" id="viewRoot"></div></main>
</div>

<div id="toast"></div>
<div class="modal-ov" id="modalOv"><div class="modal-box" id="modalBox"></div></div>

<script>
"use strict";
const SUPABASE_URL = "https://viqgnzppazhcvthaknzi.supabase.co";
const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InZpcWduenBwYXpoY3Z0aGFrbnppIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODUyNTYwMjMsImV4cCI6MjEwMDgzMjAyM30.NyGmfSLNAdq0CqjSx1kq6kK_L2iSSV5RtzgwgI0_ncc";
const TZ = "America/Sao_Paulo";
const FORMAS = ["Pix","Cartão","Débito","Crédito","Dinheiro","Outro"];

const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

/* ───────── helpers ───────── */
const $ = id => document.getElementById(id);
const esc = v => String(v ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const num = v => { const n = Number(String(v ?? "").replace(",", ".")); return Number.isFinite(n) ? n : NaN; };
const fmt = v => "R$ " + Number(v || 0).toLocaleString("pt-BR", { minimumFractionDigits: 2, maximumFractionDigits: 2 });
const fmtDT = s => s ? new Date(s).toLocaleString("pt-BR", { timeZone: TZ, day: "2-digit", month: "2-digit", hour: "2-digit", minute: "2-digit" }) : "—";
const fmtD = s => { if (!s) return "—"; const [y, m, d] = String(s).slice(0, 10).split("-"); return `${d}/${m}/${y}`; };
const hojeISO = () => new Date().toLocaleDateString("en-CA", { timeZone: TZ });
const addDias = (iso, n) => { const d = new Date(iso + "T12:00:00Z"); d.setUTCDate(d.getUTCDate() + n); return d.toISOString().slice(0, 10); };
const norm = s => String(s ?? "").normalize("NFD").replace(/[̀-ͯ]/g, "").toLowerCase();
const uuid = () => (crypto.randomUUID ? crypto.randomUUID() : "xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx".replace(/[xy]/g, c => { const r = Math.random() * 16 | 0; return (c === "x" ? r : (r & 3 | 8)).toString(16); }));
const debounce = (fn, ms) => { let t; return (...a) => { clearTimeout(t); t = setTimeout(() => fn(...a), ms); }; };

let toastTimer;
function toast(msg, erro) {
  const t = $("toast"); t.textContent = msg; t.className = "show" + (erro ? " err" : "");
  clearTimeout(toastTimer); toastTimer = setTimeout(() => t.classList.remove("show"), erro ? 5000 : 3000);
}
function openModal(html) { $("modalBox").classList.remove("wide"); $("modalBox").innerHTML = html; $("modalOv").classList.add("show"); const f = $("modalBox").querySelector("input,select,textarea"); if (f) f.focus(); }
function closeModal() { $("modalOv").classList.remove("show"); $("modalBox").innerHTML = ""; $("modalBox").classList.remove("wide"); }
const modalOpen = () => $("modalOv").classList.contains("show");

/* roda ação com botão travado; SEMPRE destrava no fim (inclusive em erro) */
async function busy(btn, fn) {
  if (btn) { if (btn.dataset.busy) return; btn.dataset.busy = "1"; btn.disabled = true; }
  try { return await fn(); }
  catch (e) { toast(msgErro(e), true); }
  finally { if (btn && btn.isConnected) { btn.disabled = false; delete btn.dataset.busy; } }
}
function msgErro(e) {
  const m = (e && e.message) || String(e);
  if (/Failed to fetch|NetworkError|Load failed/i.test(m)) return "Sem conexão com o servidor. Verifique a internet e tente de novo.";
  if (/Could not find the function|schema cache/i.test(m)) return "Falta aplicar a migração 003_caixa_avisos.sql no Supabase (veja o README).";
  return m;
}
async function rpc(nome, args) {
  const { data, error } = await sb.rpc(nome, args);
  if (error) throw new Error(error.message || "Erro no servidor");
  return data;
}
function ok(res) { if (res.error) throw new Error(res.error.message); return res.data; }

/* ───────── estado ───────── */
const S = {
  perfil: null, minhasLojas: [], loja: null,
  marcas: [], categorias: [], itens: [], sabores: [], estoque: [], precos: [], clientes: [],
  cart: [], chave: null, chaveSig: "",
  tab: "painel", channel: null, realtime: "off",
  f: { estBusca: "", estFiltro: "todos", vendaBusca: "", vendasPeriodo: "hoje", finStatus: "todos", finPeriodo: "mes", cliBusca: "",
       waPreco: true, waQtd: true, waSabores: true,
       hLoja: "", hPeriodo: "30d", hResp: "", hSit: "", ratEscopo: "loja" },
};
const isGerente = () => S.perfil && (S.perfil.papel === "gerente" || S.perfil.papel === "dono");
const itemById = id => S.itens.find(i => i.id === id);
const saborById = id => S.sabores.find(s => s.id === id);
const saboresDe = itemId => S.sabores.filter(s => s.item_id === itemId);
const precoRow = itemId => S.precos.find(p => p.item_id === itemId);
const precoAtivo = itemId => { const p = precoRow(itemId); return p && p.ativo ? Number(p.preco) : null; };
const nomeLinha = (it, sab) => sab ? `${it.nome} — ${sab.nome}` : it.nome;
const marcaNome = it => it.tipo === "modelo" ? (S.marcas.find(m => m.id === it.marca_id) || {}).nome : (S.categorias.find(c => c.id === it.categoria_id) || {}).nome;

/* linhas de estoque "vendáveis" já unidas com item/sabor */
function linhasEstoque() {
  const out = [];
  for (const e of S.estoque) {
    const item = itemById(e.item_id); if (!item) continue;
    const temSab = saboresDe(item.id).length > 0;
    if (!e.sabor_id && temSab) continue;           // linha base some quando o item tem sabores
    const sabor = e.sabor_id ? saborById(e.sabor_id) : null;
    if (e.sabor_id && !sabor) continue;
    out.push({ e, item, sabor, nome: nomeLinha(item, sabor), grupo: marcaNome(item) || "Outros" });
  }
  return out.sort((a, b) => a.grupo.localeCompare(b.grupo) || a.nome.localeCompare(b.nome));
}
const nivel = e => e.quantidade <= 0 ? "zero" : (e.quantidade <= e.estoque_minimo ? "baixo" : "ok");

/* ───────── carga de dados ───────── */
const DB = {
  async perfil() {
    const { data: { user } } = await sb.auth.getUser();
    if (!user) return false;
    const p = ok(await sb.from("perfis").select("*").eq("id", user.id).maybeSingle());
    if (!p) return false;
    S.perfil = p;
    const ac = ok(await sb.from("perfis_lojas").select("lojas(*)").eq("perfil_id", user.id));
    S.minhasLojas = (ac || []).map(a => a.lojas).filter(l => l && l.ativo !== false).sort((a, b) => a.nome.localeCompare(b.nome));
    return true;
  },
  async catalogo() {
    const [m, c, i, s] = await Promise.all([
      sb.from("marcas").select("*").order("ordem").order("nome"), sb.from("categorias").select("*").order("ordem").order("nome"),
      sb.from("itens").select("*").order("ordem").order("nome"), sb.from("sabores").select("*").order("ordem").order("nome")]);
    S.marcas = ok(m) || []; S.categorias = ok(c) || []; S.itens = ok(i) || []; S.sabores = ok(s) || [];
  },
  async estoque() { S.estoque = ok(await sb.from("estoque").select("*")) || []; },
  async precos() { S.precos = ok(await sb.from("precos_loja").select("*").eq("loja_id", S.loja.id)) || []; },
  async clientes() { S.clientes = ok(await sb.from("clientes").select("*").eq("loja_id", S.loja.id).order("nome")) || []; },
  async tudo() { await Promise.all([DB.catalogo(), DB.estoque(), DB.precos(), DB.clientes()]); },
};

/* ───────── autenticação ───────── */
const Auth = {
  async login(ev) {
    ev.preventDefault();
    const usuario = $("loginUsuario").value.trim().toLowerCase().replace(/\s+/g, "");
    const senha = $("loginSenha").value, err = $("loginErr"), btn = $("btnLogin");
    err.textContent = "";
    if (!usuario || !senha) { err.textContent = "Preencha usuário e senha."; return; }
    btn.disabled = true; btn.textContent = "Entrando...";
    try {
      const { error } = await sb.auth.signInWithPassword({ email: usuario + "@painel.local", password: senha });
      if (error) {
        err.textContent = /Invalid login/i.test(error.message) ? "Usuário ou senha inválidos." : "Não foi possível entrar: " + msgErro(error);
        return;
      }
      await App.boot();
    } catch (e) { err.textContent = msgErro(e); }
    finally { btn.disabled = false; btn.textContent = "Entrar"; }
  },
  async logout() { try { if (S.channel) await sb.removeChannel(S.channel); await sb.auth.signOut(); } finally { location.reload(); } },
};

/* ───────── app ───────── */
const App = {
  async boot() {
    let tem;
    try { tem = await DB.perfil(); } catch (e) { $("loginErr").textContent = msgErro(e); return; }
    if (!tem || !S.minhasLojas.length) {
      $("loginErr").textContent = "Este usuário não tem acesso a nenhuma loja. Fale com o administrador.";
      await sb.auth.signOut(); return;
    }
    $("loginScreen").classList.add("hidden");
    if (S.minhasLojas.length === 1) await App.entrarNaLoja(S.minhasLojas[0].id); else App.seletor();
  },
  seletor() {
    $("app").classList.remove("show");
    $("seletorSub").textContent = S.perfil.nome ? `Olá, ${S.perfil.nome}` : "Escolha a loja";
    $("seletorCards").innerHTML = S.minhasLojas.map(l => `<button class="loja-card" data-a="entrarLoja" data-id="${esc(l.id)}"><span class="ic">🏪</span>${esc(l.nome)}</button>`).join("");
    $("seletorLoja").classList.remove("hidden");
  },
  async entrarNaLoja(id) {
    const loja = S.minhasLojas.find(l => l.id === id); if (!loja) return;
    await App.pararRealtime();
    S.loja = loja; S.cart = []; S.chave = null;
    try { await DB.tudo(); } catch (e) { toast(msgErro(e), true); return; }
    $("lojaNomeChip").textContent = `${loja.nome} · ${S.perfil.nome || S.perfil.papel}`;
    $("btnTrocarLoja").classList.toggle("hidden", S.minhasLojas.length <= 1);
    $("seletorLoja").classList.add("hidden");
    $("app").classList.add("show");
    App.tabs(); App.goTab("painel"); App.iniciarRealtime();
  },
  async trocarLoja() { await App.pararRealtime(); App.seletor(); },
  tabs() {
    const t = [["painel", "📊 Painel"], ["venda", "🛒 Nova venda"], ["vendas", "🧾 Vendas"], ["estoque", "📦 Estoque"], ["clientes", "👥 Clientes"], ["financeiro", "💰 Financeiro"], ["caixa", "💵 Caixa"], ["historico", "📅 Histórico"], ["whats", "📋 Lista WhatsApp"]];
    if (isGerente()) t.push(["catalogo", "🏷️ Catálogo"]);
    $("tabsNav").innerHTML = t.map(([id, l]) => `<button class="tabbtn" id="tab-${id}" data-a="tab" data-id="${id}">${l}</button>`).join("");
  },
  goTab(id) {
    S.tab = id;
    document.querySelectorAll(".tabbtn").forEach(b => b.classList.toggle("active", b.id === "tab-" + id));
    const v = Views[id] || Views.painel;
    Promise.resolve(v.render()).catch(e => toast(msgErro(e), true));
    window.scrollTo(0, 0);
  },
  /* atualização parcial (não destrói campos digitados) */
  async atualizar() {
    if (!S.loja) return;
    const v = Views[S.tab];
    if (modalOpen()) return;
    try { await (v.update ? v.update() : v.render()); } catch (e) { toast(msgErro(e), true); }
  },
  setRt(st) { S.realtime = st; const d = $("liveDot"); d.className = "live-dot " + (st === "on" ? "on" : st === "off" ? "off" : ""); d.title = st === "on" ? "Tempo real ativo" : "Sem tempo real — o painel atualiza ao trocar de aba"; },
  iniciarRealtime() {
    const recarregarEstoque = debounce(async () => { try { await DB.estoque(); await App.atualizar(); } catch (e) { /* tenta de novo no próximo evento */ } }, 400);
    const recarregarTela = debounce(() => App.atualizar(), 500);
    App.setRt("conectando");
    S.channel = sb.channel("painel-" + S.loja.id)
      .on("postgres_changes", { event: "*", schema: "public", table: "estoque" }, recarregarEstoque)
      .on("postgres_changes", { event: "*", schema: "public", table: "vendas" }, (p) => {
        const l = (p.new && p.new.loja_id); if (p.eventType === "INSERT" && l && l !== S.loja.id) toast("🔔 Venda registrada em outra loja");
        recarregarTela();
      })
      .on("postgres_changes", { event: "*", schema: "public", table: "financeiro_lancamentos" }, recarregarTela)
      .subscribe(st => App.setRt(st === "SUBSCRIBED" ? "on" : (st === "CLOSED" || st === "CHANNEL_ERROR" || st === "TIMED_OUT") ? "off" : "conectando"));
  },
  async pararRealtime() { if (S.channel) { try { await sb.removeChannel(S.channel); } catch (e) {} S.channel = null; } App.setRt("off"); },
};

/* ESTOQUE */
Views.estoque = {
  render() {
    const f = S.f;
    $("viewRoot").innerHTML = `
      <div class="page-h"><h2>📦 Estoque compartilhado</h2></div>
      <input class="field" id="estBusca" placeholder="Buscar produto ou sabor…" value="${esc(f.estBusca)}">
      <div class="chips" id="estChips">${[["todos", "Todos"], ["baixo", "Baixo"], ["zero", "Zerados"], ["inativo", "Inativos"]].map(([k, l]) => `<button class="chip ${f.estFiltro === k ? "sel" : ""}" data-a="estFiltro" data-id="${k}">${l}</button>`).join("")}</div>
      <div id="estLista"></div>`;
    Views.estoque.update();
  },
  update() {
    const el = $("estLista"); if (!el) return;
    const q = norm(S.f.estBusca);
    let linhas = linhasEstoque().filter(l => !q || norm(l.nome + " " + l.grupo).includes(q));
    const fl = S.f.estFiltro;
    if (fl === "baixo") linhas = linhas.filter(l => nivel(l.e) === "baixo");
    else if (fl === "zero") linhas = linhas.filter(l => nivel(l.e) === "zero");
    else if (fl === "inativo") linhas = linhas.filter(l => !l.item.ativo);
    else linhas = linhas.filter(l => l.item.ativo);
    if (!linhas.length) { el.innerHTML = `<div class="empty">Nada encontrado.</div>`; return; }
    let g = "", h = "";
    for (const l of linhas) {
      if (l.grupo !== g) { g = l.grupo; h += `<div class="grupo-h">${esc(g)}</div>`; }
      const p = precoAtivo(l.item.id), n = nivel(l.e);
      h += `<div class="item-row click" data-a="estDetalhe" data-id="${esc(l.e.id)}"><div class="ic">${esc(l.item.emoji || "📦")}</div><div class="in"><b>${esc(l.nome)}</b><small>${p == null ? "⚠️ sem preço nesta loja" : esc(fmt(p))} · mín. ${l.e.estoque_minimo}${l.item.ativo ? "" : " · inativo"}</small></div><span class="qtd-badge ${n}">${l.e.quantidade}</span></div>`;
    }
    el.innerHTML = h;
  },
  async detalhe(id) {
    const l = linhasEstoque().find(x => x.e.id === id); if (!l) return;
    let mov = [];
    try {
      mov = ok(await sb.from("estoque_movimentos").select("*, perfis(nome), lojas(nome)").eq("estoque_id", id).order("criado_em", { ascending: false }).limit(25));
    } catch (e) { toast(msgErro(e), true); }
    const tipoL = { venda: "Venda", entrada: "Entrada", ajuste: "Ajuste", estorno: "Estorno" };
    openModal(`
      <h3>${esc(l.item.emoji || "📦")} ${esc(l.nome)}</h3>
      <div class="row" style="margin-bottom:6px"><span class="qtd-badge ${nivel(l.e)}">${l.e.quantidade}</span><small style="color:var(--muted)">em estoque (todas as lojas) · mínimo ${l.e.estoque_minimo}</small></div>
      ${isGerente() ? `
        <label>Entrada / saída (use − para retirar)</label>
        <div class="row"><input class="field grow" id="adjQtd" type="number" step="1" placeholder="Ex: 10 ou -2" style="margin:0"><input class="field grow" id="adjObs" placeholder="Motivo (opcional)" style="margin:0"></div>
        <div class="row" style="margin-top:8px"><button class="abtn dark" data-a="estAjustar" data-id="${esc(id)}">Aplicar</button></div>
        <label>Contagem física (define o total exato)</label>
        <div class="row"><input class="field grow" id="cntQtd" type="number" min="0" step="1" placeholder="Contei…" style="margin:0"><button class="abtn soft" data-a="estContar" data-id="${esc(id)}">Salvar contagem</button></div>
        <label>Estoque mínimo (alerta)</label>
        <div class="row"><input class="field grow" id="minQtd" type="number" min="0" step="1" value="${l.e.estoque_minimo}" style="margin:0"><button class="abtn soft" data-a="estMinimo" data-id="${esc(id)}">Salvar</button></div>` : `<div class="banner" style="margin-top:8px">Só gerente/dono ajusta o estoque.</div>`}
      <label>Histórico</label>
      ${mov.length ? mov.map(m => `<div class="list-row"><div class="grow">${esc(tipoL[m.tipo] || m.tipo)} <b class="${m.quantidade < 0 ? "neg" : "pos"}">${m.quantidade > 0 ? "+" : ""}${m.quantidade}</b> → ${m.saldo_resultante}<small>${esc(fmtDT(m.criado_em))} · ${esc((m.perfis && m.perfis.nome) || "—")} · ${esc((m.lojas && m.lojas.nome) || "—")}${m.observacao ? " · " + esc(m.observacao) : ""}</small></div></div>`).join("") : `<div class="empty">Sem movimentos.</div>`}
      <div class="modal-actions"><button class="btn btn-soft" data-a="fechar">Fechar</button></div>`);
  },
};

/* NOVA VENDA */
Views.venda = {
  render() {
    $("viewRoot").innerHTML = `
      <div class="page-h"><h2>🛒 Nova venda</h2></div>
      <div class="two-col">
        <div><input class="field" id="vBusca" placeholder="Buscar produto ou sabor…" value="${esc(S.f.vendaBusca)}" autocomplete="off"><div id="vResultados"></div></div>
        <div class="card" id="vCarrinho"></div>
      </div>`;
    Views.venda.update();
  },
  update() {
    if (!$("vResultados")) return;
    Views.venda.resultados(); Views.venda.carrinho();
  },
  resultados() {
    const q = norm(S.f.vendaBusca);
    const linhas = linhasEstoque().filter(l => l.item.ativo && (!q || norm(l.nome + " " + l.grupo).includes(q))).slice(0, 60);
    $("vResultados").innerHTML = linhas.length ? linhas.map(l => {
      const p = precoAtivo(l.item.id), semEst = l.e.quantidade <= 0, off = p == null || semEst;
      return `<div class="sel-result ${off ? "off" : ""}" ${off ? "" : `data-a="vAdd" data-id="${esc(l.e.id)}"`}><div><b>${esc(l.item.emoji || "")} ${esc(l.nome)}</b><small>${esc(l.grupo)} · ${semEst ? "sem estoque" : l.e.quantidade + " em estoque"}</small></div><b>${p == null ? "sem preço" : esc(fmt(p))}</b></div>`;
    }).join("") : `<div class="empty">Nada encontrado.</div>`;
  },
  carrinho() {
    const lin = S.cart.map(c => { const l = linhasEstoque().find(x => x.e.id === c.estoque_id); return l ? { c, l, p: precoAtivo(l.item.id) } : null; }).filter(Boolean);
    S.cart = lin.map(x => x.c);                          // remove linhas que sumiram
    const sub = lin.reduce((s, x) => s + (x.p || 0) * x.c.qtd, 0);
    const desc = Math.min(Math.max(num($("vDesc") ? $("vDesc").value : "") || 0, 0), sub);
    // preserva o que já foi digitado
    const keep = id => ($(id) ? $(id).value : "");
    const cli = { nome: keep("vCliNome"), tel: keep("vCliTel"), end: keep("vCliEnd"), forma: keep("vForma") || "Pix", desc: keep("vDesc") };
    $("vCarrinho").innerHTML = `
      <h3>Carrinho</h3>
      ${lin.length ? lin.map(({ c, l, p }) => `<div class="cart-item"><div class="ci-info"><b>${esc(l.nome)}</b><small>${esc(fmt(p))} cada · disp. ${l.e.quantidade}</small></div>
        <div class="qty"><button data-a="vMenos" data-id="${esc(c.estoque_id)}" aria-label="menos">−</button><span>${c.qtd}</span><button data-a="vMais" data-id="${esc(c.estoque_id)}" aria-label="mais">+</button></div>
        <b style="min-width:70px;text-align:right">${esc(fmt((p || 0) * c.qtd))}</b></div>`).join("") : `<div class="empty">Toque num produto para adicionar.</div>`}
      <label>Cliente</label>
      <input class="field" id="vCliNome" list="vCliList" placeholder="Nome do cliente (opcional)" value="${esc(cli.nome)}" autocomplete="off">
      <datalist id="vCliList">${S.clientes.map(c => `<option value="${esc(c.nome)}">${esc(c.telefone || "")}</option>`).join("")}</datalist>
      <div class="grid2"><input class="field" id="vCliTel" placeholder="Telefone" inputmode="tel" value="${esc(cli.tel)}"><input class="field" id="vCliEnd" placeholder="Endereço" value="${esc(cli.end)}"></div>
      <div class="grid2"><div><label>Pagamento</label><select class="field" id="vForma">${FORMAS.map(f => `<option ${f === cli.forma ? "selected" : ""}>${f}</option>`).join("")}</select></div>
        <div><label>Desconto (R$)</label><input class="field" id="vDesc" inputmode="decimal" placeholder="0,00" value="${esc(cli.desc)}"></div></div>
      <div class="tt-row"><span>Subtotal</span><span>${esc(fmt(sub))}</span></div>
      <div class="tt-row"><span>Desconto</span><span>− ${esc(fmt(desc))}</span></div>
      <div class="tt-row big"><span>Total</span><span>${esc(fmt(sub - desc))}</span></div>
      <button class="btn btn-red" style="margin-top:12px" data-a="vConfirmar" ${lin.length ? "" : "disabled"}>Finalizar venda</button>
      ${lin.length ? `<button class="btn btn-soft" style="margin-top:8px" data-a="vLimpar">Limpar carrinho</button>` : ""}`;
  },
  add(estId) {
    const l = linhasEstoque().find(x => x.e.id === estId); if (!l) return;
    const c = S.cart.find(x => x.estoque_id === estId);
    if ((c ? c.qtd : 0) + 1 > l.e.quantidade) return toast(`Só há ${l.e.quantidade} em estoque`, true);
    if (c) c.qtd++; else S.cart.push({ estoque_id: estId, item_id: l.item.id, sabor_id: l.sabor ? l.sabor.id : null, qtd: 1 });
    Views.venda.carrinho();
  },
  mudar(estId, d) {
    const c = S.cart.find(x => x.estoque_id === estId); if (!c) return;
    const l = linhasEstoque().find(x => x.e.id === estId);
    if (d > 0 && l && c.qtd + 1 > l.e.quantidade) return toast(`Só há ${l.e.quantidade} em estoque`, true);
    c.qtd += d; if (c.qtd <= 0) S.cart = S.cart.filter(x => x !== c);
    Views.venda.carrinho();
  },
  dados() {
    const lin = S.cart.map(c => { const l = linhasEstoque().find(x => x.e.id === c.estoque_id); return { c, l, p: l ? precoAtivo(l.item.id) : null }; });
    if (!lin.length) throw new Error("Carrinho vazio");
    if (lin.some(x => !x.l || x.p == null)) throw new Error("Há item sem preço ou removido no carrinho");
    const sub = lin.reduce((s, x) => s + x.p * x.c.qtd, 0);
    const descRaw = ($("vDesc").value || "").trim();
    const desc = descRaw === "" ? 0 : num(descRaw);
    if (!Number.isFinite(desc) || desc < 0) throw new Error("Desconto inválido");
    if (desc > sub) throw new Error("O desconto não pode ser maior que o subtotal");
    const nome = $("vCliNome").value.trim(), tel = $("vCliTel").value.trim(), end = $("vCliEnd").value.trim();
    return { lin, sub, desc, total: sub - desc, forma: $("vForma").value, cliente: (nome || tel) ? { nome, telefone: tel, endereco: end } : null };
  },
  confirmar() {
    let d; try { d = Views.venda.dados(); } catch (e) { return toast(e.message, true); }
    openModal(`<h3>Confirmar venda</h3>
      ${d.lin.map(x => `<div class="list-row"><div class="grow">${x.c.qtd}× ${esc(x.l.nome)}</div><b>${esc(fmt(x.p * x.c.qtd))}</b></div>`).join("")}
      <div class="tt-row"><span>Desconto</span><span>− ${esc(fmt(d.desc))}</span></div>
      <div class="tt-row big"><span>Total · ${esc(d.forma)}</span><span>${esc(fmt(d.total))}</span></div>
      ${d.cliente ? `<div class="tt-row"><span>Cliente</span><span>${esc(d.cliente.nome || d.cliente.telefone)}</span></div>` : ""}
      <div class="modal-actions"><button class="btn btn-soft" data-a="fechar">Voltar</button><button class="btn btn-red" data-a="vEnviar">✔ Confirmar</button></div>`);
  },
  async enviar(btn) {
    let d; try { d = Views.venda.dados(); } catch (e) { closeModal(); return toast(e.message, true); }

    if (!S.chave || S.chaveSig !== sig) { S.chave = uuid(); S.chaveSig = sig; }   // mesma chave só para reenvio idêntico
    await busy(btn, async () => {
      const r = await rpc("registrar_venda", { p_loja_id: S.loja.id, p_itens: itens, p_cliente: d.cliente, p_forma_pagamento: d.forma, p_desconto: d.desc, p_chave: S.chave });
      S.cart = []; S.chave = null; S.chaveSig = "";

      Views.venda.render();
    });
  },
};

      <div class="banner" style="margin-top:8px" id="pgAviso">Isto apenas <b>registra um pagamento já realizado</b>: não transfere dinheiro e <b>não movimenta o caixa automaticamente</b>. Se saiu dinheiro da gaveta, lance também uma saída/retirada na aba Caixa.</div>
      <label>Valor pago (R$)</label><input class="field" id="pgValor" inputmode="decimal" value="${esc(String(c.saldo).replace(".", ","))}">
      <div class="grid2"><div><label>Data do pagamento</label><input class="field" id="pgData" type="date" value="${hojeISO()}" max="${hojeISO()}"></div>
      <div><label>Forma</label><select class="field" id="pgForma">${FORMAS_PAG.map(f => `<option>${f}</option>`).join("")}</select></div></div>
      <label>Observação (opcional)</label><input class="field" id="pgObs">
      <div class="modal-actions"><button class="btn btn-soft" data-a="finVoltar" data-id="${esc(id)}">Voltar</button><button class="btn btn-red" data-a="finPagSalvar" data-id="${esc(id)}">Confirmar pagamento</button></div>`);
  },
  async pagSalvar(id, btn) {
    const c = S.conta.conta, v = num($("pgValor").value), data = $("pgData").value || hojeISO();
    if (!centavosOk(v)) return toast("Informe um valor maior que zero, com até 2 casas decimais", true);
    if (v > Number(c.saldo) + 1e-9) return toast(`O pagamento passa do saldo (${fmt(c.saldo)})`, true);
    if (data > hojeISO()) return toast("A data do pagamento não pode ser futura", true);
    const args = { p_lancamento_id: id, p_valor: v, p_data: data, p_forma: $("pgForma").value, p_observacao: $("pgObs").value.trim() || null };
    const sig = JSON.stringify(args);
    if (!S.pagChave || S.pagSig !== sig) { S.pagChave = uuid(); S.pagSig = sig; }     // mesma chave só para reenvio idêntico (evita duplicar)
    await busy(btn, async () => {
      await rpc("registrar_pagamento", { ...args, p_chave: S.pagChave });
      S.pagChave = null; S.pagSig = ""; toast("Pagamento registrado");
      await Views.financeiro.detalhe(id); Views.financeiro.render().catch(() => {});
    });
  },
  estornarForm(id) {
    openModal(`<h3>Estornar pagamento</h3><div class="banner">O pagamento original continua no histórico; um estorno é registrado ao lado dele, com seu nome e o motivo.</div>
      <label>Motivo (mín. 5 letras)</label><input class="field" id="esPgMotivo">

  },
  async estornarOk(id, btn) {
    const m = $("esPgMotivo").value.trim(); if (m.length < 5) return toast("Informe o motivo (mín. 5 letras)", true);
    await busy(btn, async () => { await rpc("estornar_pagamento", { p_pagamento_id: id, p_motivo: m }); toast("Estorno registrado"); await Views.financeiro.detalhe(S.conta.conta.id); Views.financeiro.render().catch(() => {}); });
  },
  cancelarForm(id) {
    openModal(`<h3>Cancelar conta</h3><label>Motivo (mín. 5 letras)</label><input class="field" id="caMotivo">
      <div class="modal-actions"><button class="btn btn-soft" data-a="finVoltar" data-id="${esc(id)}">Voltar</button><button class="btn btn-red" data-a="finCancelarOk" data-id="${esc(id)}">Cancelar conta</button></div>`);
  },
  async cancelarOk(id, btn) {
    const m = $("caMotivo").value.trim(); if (m.length < 5) return toast("Informe o motivo (mín. 5 letras)", true);
    await busy(btn, async () => { await rpc("cancelar_conta", { p_id: id, p_motivo: m }); toast("Conta cancelada"); await Views.financeiro.detalhe(id); Views.financeiro.render().catch(() => {}); });
  },

  /* ---- comprovantes ---- */
  escolherArquivo(pagId) { const i = $("arq-" + pagId); if (i) i.click(); },
  async anexar(pagId, file, btn) {
    if (!file) return;
    const ext = TIPOS_ARQ[file.type];
    if (!ext) return toast("Tipo não permitido. Use PDF, JPG, PNG ou WEBP.", true);
    if (file.size < 1 || file.size > MAX_ARQ) return toast("O arquivo precisa ter entre 1 byte e 5 MB.", true);
    const c = S.conta.conta, path = `${c.loja_id}/${pagId}/${uuid()}.${ext}`;
    const st = { path, nome: file.name, mime: file.type, tamanho: file.size };
    toast("Enviando comprovante…");
    // 1) envia o arquivo (se falhar, nada foi registrado e o pagamento segue intacto; é só escolher o arquivo de novo)
    let error = null;
    try { ({ error } = await sb.storage.from("comprovantes").upload(path, file, { contentType: file.type, upsert: false })); }
    catch (e) { error = e; }     // queda de rede: o supabase-js lança em vez de devolver "error"
    if (error) return toast("Falha no envio do arquivo: " + msgErro(error) + " — o pagamento não foi afetado; tente de novo.", true);
    S.upPend = S.upPend || {}; S.upPend[pagId] = st;      // arquivo já está no bucket: se o registro falhar, só ele é repetido
    await Views.financeiro.registrarArq(pagId, btn);
  },
  async registrarArq(pagId, btn) {
    const st = (S.upPend || {})[pagId]; if (!st) return;
    await busy(btn, async () => {
      try { await rpc("registrar_comprovante", { p_pagamento_id: pagId, p_path: st.path, p_nome: st.nome, p_mime: st.mime, p_tamanho: st.tamanho }); }
      catch (e) {   // o arquivo já está no bucket: mostra o botão para repetir só o registro (sem reenviar nem duplicar o pagamento)
        toast("Arquivo enviado, mas o registro falhou: " + msgErro(e) + " — use \"Tentar registrar de novo\".", true);
        return Views.financeiro.detalhe(S.conta.conta.id);
      }
      delete S.upPend[pagId]; toast("Comprovante anexado"); await Views.financeiro.detalhe(S.conta.conta.id); Views.financeiro.render().catch(() => {});
    });
  },
  async baixar(path) {
    const { data, error } = await sb.storage.from("comprovantes").createSignedUrl(path, 60, { download: true });   // link temporário (60 s) que força "baixar" em vez de abrir no navegador
    if (error || !data) return toast("Não foi possível abrir o arquivo: " + msgErro(error || { message: "sem permissão" }), true);
    window.open(data.signedUrl, "_blank", "noopener");
  },
  async confirmarEnvio(pagId, btn) {
    const obs = prompt("Observação (opcional) — ex: enviado por WhatsApp ao fornecedor:", "");
    if (obs === null) return;
    await busy(btn, async () => { await rpc("confirmar_envio_comprovante", { p_pagamento_id: pagId, p_observacao: obs || null }); toast("Envio confirmado"); await Views.financeiro.detalhe(S.conta.conta.id); Views.financeiro.render().catch(() => {}); });
  },
  csv() {
    const ls = S.finLista || []; if (!ls.length) return toast("Nada para exportar", true);
    const cel = v => '"' + String(v ?? "").replace(/"/g, '""') + '"';
    const seguro = v => { const s = String(v ?? ""); return /^[=+\-@]/.test(s) ? "'" + s : s; };   // evita fórmulas em planilhas
    const m = v => String(v).replace(".", ",");
    const linhas = [["Data", "Tipo", "Categoria", "Descrição", "Valor original", "Total pago", "Saldo", "Situação", "Vencimento", "Comprovante: envio pendente"]].concat(ls.map(l =>
      [fmtD(String(l.data_ref).slice(0, 10)), l.tipo, l.categoria, seguro(l.descricao), m(l.valor), m(l.total_pago), m(l.saldo), SIT_TXT[l.situacao] + (l.vencida ? " (saldo vencido)" : ""), l.vencimento || "", l.envios_pendentes || 0]));
    const blob = new Blob(["﻿" + linhas.map(r => r.map(cel).join(";")).join("\r\n")], { type: "text/csv;charset=utf-8" });
    const a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = `financeiro-${hojeISO()}.csv`; document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(a.href), 2000);
  },
};

      const p = await rpc("rateio_previa", { p_valor_total: a.total, p_metodo: a.metodo, p_itens: a.itens });

      $("rtPrevia").innerHTML = `<div class="card" style="padding:10px;margin-top:8px"><b>Prévia (calculada pelo servidor)</b>
        ${p.parcelas.map(x => `<div class="list-row"><div class="grow">${esc(x.loja_nome)}<small>${esc(String(x.percentual))}%${x.ajuste_centavos ? " · inclui +R$ 0,01 de arredondamento" : ""}</small></div><b>${esc(fmt(x.valor))}</b></div>`).join("")}
        <div class="tt-row big"><span>Soma das parcelas</span><span>${esc(fmt(p.soma))}</span></div>
        ${Number(p.ajustes) ? `<small style="color:var(--muted)">${p.ajustes} centavo(s) de arredondamento distribuído(s) de forma determinística: um a um, seguindo a ordem alfabética das lojas (no percentual, pelo maior resto).</small>` : `<small style="color:var(--muted)">Divisão exata, sem arredondamento.</small>`}</div>`;

  /* ---- comprovantes (mesma lógica de nova tentativa dos pagamentos de conta) ---- */
  async anexar(movId, kind, file) {
    if (!file) return;
    const ext = TIPOS_ARQ[file.type];
    if (!ext) return toast("Tipo não permitido. Use PDF, JPG, PNG ou WEBP.", true);
    if (file.size < 1 || file.size > MAX_ARQ) return toast("O arquivo precisa ter entre 1 byte e 5 MB.", true);
    const path = `rateio/${S.ratDet.rateio.id}/${movId}/${uuid()}.${ext}`, st = { path, nome: file.name, mime: file.type, tamanho: file.size, kind };
    toast("Enviando comprovante…");
    let error = null;
    try { ({ error } = await sb.storage.from("comprovantes").upload(path, file, { contentType: file.type, upsert: false })); } catch (e) { error = e; }
    if (error) return toast("Falha no envio do arquivo: " + msgErro(error) + " — o registro financeiro não foi afetado; tente de novo.", true);
    S.upPend = S.upPend || {}; S.upPend[movId] = st;
    await Views.rateios.registrarArq(movId);
  },
  async registrarArq(movId, btn) {
    const st = (S.upPend || {})[movId]; if (!st) return;
    await busy(btn, async () => {

/* LISTA WHATSAPP */
Views.whats = {
  texto() {
    const f = S.f, linhas = linhasEstoque().filter(l => l.item.ativo && l.e.quantidade > 0 && precoAtivo(l.item.id) != null);
    const porGrupo = new Map();
    for (const l of linhas) { if (!porGrupo.has(l.grupo)) porGrupo.set(l.grupo, new Map()); const m = porGrupo.get(l.grupo); if (!m.has(l.item.id)) m.set(l.item.id, []); m.get(l.item.id).push(l); }
    let t = `*${S.loja.nome}* — lista de ${new Date().toLocaleDateString("pt-BR", { timeZone: TZ })}\n`;
    for (const [g, itens] of porGrupo) {
      t += `\n*${g.toUpperCase()}*\n`;
      for (const ls of itens.values()) {
        const it = ls[0].item, p = fmt(precoAtivo(it.id));
        if (ls.length === 1 && !ls[0].sabor) { t += `${it.emoji || "▪️"} ${it.nome}${f.waPreco ? " — " + p : ""}${f.waQtd ? ` (${ls[0].e.quantidade} un)` : ""}\n`; continue; }
        t += `${it.emoji || "▪️"} ${it.nome}${f.waPreco ? " — " + p : ""}\n`;
        if (f.waSabores) for (const l of ls) t += `   • ${l.sabor.nome}${f.waQtd ? ` (${l.e.quantidade})` : ""}\n`;
      }
    }
    return { t: linhas.length ? t.trimEnd() : "", n: linhas.length };
  },
  render() {
    const f = S.f, { t, n } = Views.whats.texto();
    $("viewRoot").innerHTML = `<div class="page-h"><h2>📋 Lista para WhatsApp</h2></div>
      <div class="card"><div class="check"><input type="checkbox" id="waPreco" ${f.waPreco ? "checked" : ""}><label for="waPreco" style="margin:0;font-size:.84rem;color:var(--text)">Mostrar preços</label></div>
      <div class="check"><input type="checkbox" id="waQtd" ${f.waQtd ? "checked" : ""}><label for="waQtd" style="margin:0;font-size:.84rem;color:var(--text)">Mostrar quantidades</label></div>
      <div class="check"><input type="checkbox" id="waSabores" ${f.waSabores ? "checked" : ""}><label for="waSabores" style="margin:0;font-size:.84rem;color:var(--text)">Listar sabores</label></div></div>
      <div class="banner">Só entram itens ativos, com estoque e com preço nesta loja (${n} linha(s)). Itens esgotados somem sozinhos.</div>
      <div id="waPreview">${t ? esc(t) : "Nada disponível para listar."}</div>
      <div class="row" style="margin-top:10px"><button class="abtn dark" data-a="waCopiar" ${t ? "" : "disabled"}>📋 Copiar</button><button class="abtn green" data-a="waEnviar" ${t ? "" : "disabled"}>Enviar no WhatsApp</button></div>`;
  },
  async copiar() {
    const { t } = Views.whats.texto();
    try { await navigator.clipboard.writeText(t); toast("Lista copiada"); }
    catch (e) { const r = document.createRange(); r.selectNodeContents($("waPreview")); const s = getSelection(); s.removeAllRanges(); s.addRange(r); toast("Selecionei o texto — copie manualmente", true); }
  },
  enviar() { const { t } = Views.whats.texto(); window.open("https://wa.me/?text=" + encodeURIComponent(t), "_blank", "noopener"); },
};

Views.catalogo = {

  },
  async item(btn) {
    const g = $("niGrupo").value; if (!g) return toast("Crie uma marca ou categoria primeiro", true);
    const nome = $("niNome").value.trim(); if (!nome) return toast("Informe o nome do item", true);
    const sabores = $("niSabores").value.split(",").map(s => s.trim()).filter(Boolean);
    if (new Set(sabores.map(norm)).size !== sabores.length) return toast("Há sabores repetidos", true);
    const q = parseInt($("niQtd").value || "0", 10), min = parseInt($("niMin").value || "0", 10);
    if (!(q >= 0) || !(min >= 0)) return toast("Quantidades inválidas", true);
    await busy(btn, async () => {
      await rpc("criar_item", { p_loja_id: S.loja.id, p_tipo: g[0] === "m" ? "modelo" : "produto", p_marca_id: g[0] === "m" ? g.slice(2) : null, p_categoria_id: g[0] === "c" ? g.slice(2) : null,
        p_nome: nome, p_emoji: $("niEmoji").value.trim() || null, p_sabores: sabores, p_estoque_inicial: q, p_estoque_minimo: min });

    const it = itemById(id); if (!it) return; const p = precoRow(id);
    openModal(`<h3>${esc(it.emoji || "")} ${esc(it.nome)}</h3>
      <label>Preço nesta loja (R$)</label><input class="field" id="pPreco" inputmode="decimal" value="${p ? esc(String(p.preco).replace(".", ",")) : ""}" placeholder="0,00">
      <div class="check"><input type="checkbox" id="pAtivo" ${!p || p.ativo ? "checked" : ""}><label for="pAtivo" style="margin:0;font-size:.84rem;color:var(--text)">Vender nesta loja</label></div>
      <div class="check"><input type="checkbox" id="iAtivo" ${it.ativo ? "checked" : ""}><label for="iAtivo" style="margin:0;font-size:.84rem;color:var(--text)">Item ativo (todas as lojas)</label></div>
      <label>Adicionar sabor</label><div class="row"><input class="field grow" id="sNome" placeholder="Nome do sabor" style="margin:0"><input class="field" id="sQtd" type="number" min="0" value="0" style="margin:0;width:90px" title="Quantidade inicial"><button class="abtn dark" data-a="catSabor" data-id="${esc(id)}">+</button></div>

  async salvar(id, btn) {

    await busy(btn, async () => {
      if (preco !== null) ok(await sb.from("precos_loja").upsert({ loja_id: S.loja.id, item_id: id, preco: Math.round(preco * 100) / 100, ativo: $("pAtivo").checked }, { onConflict: "loja_id,item_id" }));
      ok(await sb.from("itens").update({ ativo: $("iAtivo").checked }).eq("id", id));
      await Promise.all([DB.catalogo(), DB.precos()]); closeModal(); toast("Salvo"); Views.catalogo.render();
    });
  },

    const q = parseInt($("sQtd").value || "0", 10); if (!(q >= 0)) return toast("Quantidade inválida", true);
    await busy(btn, async () => { await rpc("adicionar_sabor", { p_loja_id: S.loja.id, p_item_id: id, p_nome: nome, p_quantidade: q }); await Promise.all([DB.catalogo(), DB.estoque()]); toast("Sabor adicionado"); Views.catalogo.editar(id); });

};

          ${x.pode_editar ? `<button class="abtn soft sm" data-a="avisoForm" data-id="${i}">Editar</button><button class="abtn soft sm" data-a="avisoArquivar" data-id="${i}">Arquivar</button>` : ""}</div></div>`).join("") : `<div class="empty">Nenhum aviso no momento.</div>`}

    await busy(btn, async () => {
      if (x.origem === "alerta") await rpc("marcar_alerta_lido", { p_loja_id: S.loja.id, p_chave: x.chave });

      <div class="grid2"><div><label>Prioridade</label><select class="field" id="avPrio">${[["info", "Informação"], ["atencao", "Atenção"], ["urgente", "Urgente"]].map(([k, l]) => `<option value="${k}" ${x && x.prioridade === k ? "selected" : ""}>${l}</option>`).join("")}</select></div>
        <div><label>Válido até (opcional)</label><input class="field" id="avValido" type="date" value="${x && x.valido_ate ? esc(String(x.valido_ate).slice(0, 10)) : ""}"></div></div>
      <div class="check"><input type="checkbox" id="avDestaque" ${x && x.destaque ? "checked" : ""}><label for="avDestaque" style="margin:0;font-size:.84rem;color:var(--text)">Destacar no topo</label></div>
      ${S.perfil.papel === "dono" ? `<div class="check"><input type="checkbox" id="avGlobal" ${x && x.global ? "checked" : ""}><label for="avGlobal" style="margin:0;font-size:.84rem;color:var(--text)">Aviso global (todas as lojas)</label></div>

    const titulo = $("avTitulo").value.trim(), desc = $("avDesc").value.trim();

    if (!desc) return toast("Escreva a descrição", true);
    const global = !!($("avGlobal") && $("avGlobal").checked), sistema = !!($("avSistema") && $("avSistema").checked);
    const lojas = [...document.querySelectorAll(".avLoja:checked")].map(c => c.value);
    if (!global && !lojas.length) return toast("Escolha pelo menos uma loja", true);
    const v = $("avValido").value;
    await busy(btn, async () => {
      await rpc("publicar_aviso", { p_id: id || null, p_tipo: sistema ? "sistema" : "comunicado", p_titulo: titulo, p_descricao: desc, p_prioridade: $("avPrio").value,

      closeModal(); toast("Aviso publicado"); if (S.tab === "painel") await Views.painel.render();

};

        p_observacao: obs || null, p_sentido: tipo === "ajuste" ? parseInt($("mvSent").value, 10) : null });

  estornar(id) {
    openModal(`<h3>Estornar movimentação</h3><div class="banner">O lançamento original continua no histórico; um estorno é registrado ao lado dele.</div>

  },

    openModal(`<h3>Fechar caixa</h3>
      <div class="tt-row"><span>Saldo inicial</span><span>${esc(fmt(c.saldo_inicial))}</span></div><div class="tt-row"><span>+ Vendas em dinheiro</span><span>${esc(fmt(c.vendas_dinheiro))}</span></div>
      <div class="tt-row"><span>± Movimentos em dinheiro</span><span>${esc(fmt(c.mov_dinheiro))}</span></div><div class="tt-row big"><span>Esperado na gaveta</span><span id="fcEsp" data-v="${esc(c.esperado_dinheiro)}">${esc(fmt(c.esperado_dinheiro))}</span></div>
      <small style="color:var(--muted)">Pix e cartão (${esc(fmt(Number(c.vendas_pix) + Number(c.vendas_cartao)))}) não entram na gaveta.</small>

      <div class="tt-row big"><span>Diferença</span><span id="fcDif">—</span></div>
      <label>Justificativa (obrigatória se houver diferença)</label><textarea class="field" id="fcJust"></textarea>
      <div class="modal-actions"><button class="btn btn-soft" data-a="fechar">Voltar</button><button class="btn btn-red" data-a="cxFecharOk">Fechar caixa</button></div>`);
  },
  atualizaDif() {
    const v = num($("fcVal").value), esp = Number($("fcEsp").dataset.v);
    $("fcDif").textContent = Number.isFinite(v) ? fmt(Math.round((v - esp) * 100) / 100) : "—";
  },
  async fecharOk(btn) {

    if (raw === "" || !Number.isFinite(v) || v < 0 || Math.abs(Math.round(v * 100) - v * 100) > 1e-6) return toast("Informe o dinheiro contado (até 2 casas)", true);
    const dif = Math.round((v - Number($("fcEsp").dataset.v)) * 100) / 100, just = $("fcJust").value.trim();
    if (dif !== 0 && !just) return toast("Há diferença — informe a justificativa", true);
    if (!confirm(`Fechar o caixa com ${fmt(v)} contados${dif ? ` (diferença ${fmt(dif)})` : ""}?`)) return;
    await busy(btn, async () => { await rpc("fechar_caixa", { p_caixa_id: S.caixa.aberto.id, p_valor_conferido: v, p_justificativa: just || null }); closeModal(); toast("Caixa fechado"); await Views.caixa.render(); });
  },
  reabrir(id) {
    openModal(`<h3>Reabrir caixa</h3><div class="banner">Fica registrado quem reabriu, quando e por quê. O fechamento anterior é guardado na auditoria.</div>
      <label>Motivo (mín. 5 letras)</label><input class="field" id="raMotivo">
      <div class="modal-actions"><button class="btn btn-soft" data-a="fechar">Cancelar</button><button class="btn btn-red" data-a="cxReabrirOk" data-id="${esc(id)}">Reabrir</button></div>`);
  },

  async detalhe(id) {

    openModal(`<h3>Caixa de ${esc(c.loja_nome)} · ${esc(fmtD(String(c.aberto_em).slice(0, 10)))}</h3>
      <div class="row" style="margin-bottom:6px"><span class="tag ${c.status === "aberto" ? "pendente" : "pago"}">${esc(c.status)}</span><small style="color:var(--muted)">Aberto por ${esc(c.aberto_por_nome || "—")} com ${esc(fmt(c.saldo_inicial))}${c.reaberturas ? " · reaberto " + c.reaberturas + "×" : ""}</small></div>
      ${c.status === "fechado" ? Views.caixa.resumoFechado(c) : `<div class="tt-row"><span>Esperado agora</span><span>${esc(fmt(c.esperado_dinheiro))}</span></div>`}
      <label>Movimentações</label>${d.movimentos.length ? d.movimentos.map(m => `<div class="list-row"><div class="grow">${esc(TIPOS_MOV[m.tipo] || m.tipo)} · ${esc(m.categoria)} · ${esc(MEIOS[m.meio] || m.meio)}${m.estornado ? " (estornada)" : ""}<small>${esc(fmtDT(m.criado_em))} · ${esc(m.criado_por_nome || "—")}${m.observacao ? " · " + esc(m.observacao) : ""}</small></div><b>${m.sentido > 0 ? "+" : "−"}${esc(fmt(m.valor))}</b></div>`).join("") : `<div class="empty">Nenhuma.</div>`}
      <label>Auditoria</label>${d.auditoria.map(a => `<div class="list-row"><div class="grow">${esc(a.acao)}${a.motivo ? " — " + esc(a.motivo) : ""}<small>${esc(fmtDT(a.em))} · ${esc(a.por || "—")}</small></div></div>`).join("")}
      <div class="modal-actions"><button class="btn btn-soft" data-a="fechar">Fechar</button></div>`);
  },
};

Views.caixa.update = async function () {   // atualização em segundo plano: não apaga o que está sendo digitado
  const a = document.activeElement; if (a && ["cxSaldo", "cxObs"].includes(a.id)) return;
  if ($("cxSaldo") && $("cxSaldo").value) return;
  return Views.caixa.render();
};

/* HISTÓRICO FINANCEIRO (por dia) */
Views.historico = {
  async render() {
    const f = S.f;
    if (!S.respLista) { try { S.respLista = ok(await sb.from("perfis").select("id,nome").order("nome")); } catch (e) { S.respLista = []; } }
    if (!S.lojasFiltro) { S.lojasFiltro = S.minhasLojas; if (S.perfil.papel === "dono") { try { S.lojasFiltro = ok(await sb.from("lojas").select("id,nome,ativo").order("nome")).filter(l => l.ativo !== false); } catch (e) {} } }
    $("viewRoot").innerHTML = `<div class="page-h"><h2>📅 Histórico financeiro</h2></div>
      <div class="card"><div class="grid2"><div><label>Loja</label><select class="field" id="hLoja"><option value="">${S.perfil.papel === "dono" ? "Todas (consolidado)" : "Todas as minhas"}</option>${S.lojasFiltro.map(l => `<option value="${esc(l.id)}" ${f.hLoja === l.id ? "selected" : ""}>${esc(l.nome)}</option>`).join("")}</select></div>
        <div><label>Período</label><select class="field" id="hPeriodo">${[["7d", "Últimos 7 dias"], ["30d", "Últimos 30 dias"], ["mes", "Este mês"], ["90d", "Últimos 90 dias"]].map(([k, l]) => `<option value="${k}" ${f.hPeriodo === k ? "selected" : ""}>${l}</option>`).join("")}</select></div>
        <div><label>Responsável</label><select class="field" id="hResp"><option value="">Todos</option>${S.respLista.map(p => `<option value="${esc(p.id)}" ${f.hResp === p.id ? "selected" : ""}>${esc(p.nome || "—")}</option>`).join("")}</select></div>
        <div><label>Situação do caixa</label><select class="field" id="hSit">${[["", "Todas"], ["aberto", "Aberto"], ["fechado", "Fechado"], ["diferenca", "Com diferença"]].map(([k, l]) => `<option value="${k}" ${f.hSit === k ? "selected" : ""}>${l}</option>`).join("")}</select></div></div></div>
      <div id="hLista"><div class="empty">Carregando…</div></div>
      <div id="hSemCaixa"></div>`;
    await Views.historico.update();
  },
  async update() {
    const el = $("hLista"); if (!el) return;
    const f = S.f, hoje = hojeISO();
    const ini = { "7d": addDias(hoje, -6), "30d": addDias(hoje, -29), "90d": addDias(hoje, -89), mes: hoje.slice(0, 8) + "01" }[f.hPeriodo];
    const dias = await rpc("historico_financeiro", { p_loja_id: f.hLoja || null, p_inicio: ini, p_fim: hoje, p_responsavel: f.hResp || null, p_situacao: f.hSit || null });
    if (S.tab !== "historico" || !$("hLista")) return;
    Views.historico.semCaixa(ini, hoje);   // seção separada: falha dela não derruba o histórico
    S.hDias = dias;
    const sit = { aberto: ["pendente", "caixa aberto"], fechado: ["pago", "fechado"], sem_caixa: ["neutro", "sem caixa"] };
    $("hLista").innerHTML = dias.length ? dias.map((d, i) => `<div class="dia-row"><div class="dia-h" data-a="hDia" data-id="${i}"><div class="grow"><b>${esc(fmtD(d.dia))}</b> · ${esc(d.loja_nome)}</div><span class="tag ${sit[d.situacao][0]}">${sit[d.situacao][1]}</span>
        <div class="dia-nums"><div><span>Abertura</span><b>${esc(fmt(d.abertura))}</b></div><div><span>Entradas</span><b class="pos">${esc(fmt(d.entradas))}</b></div><div><span>Saídas</span><b class="neg">${esc(fmt(d.saidas))}</b></div>
        <div><span>Estornos</span><b>${esc(fmt(d.estornos))}</b></div><div><span>Resultado do dia</span><b>${esc(fmt(d.saldo))}</b></div><div><span>Fechamento (dinheiro)</span><b>${d.situacao === "fechado" ? esc(fmt(d.fechamento)) : "—"}</b></div>
        <div><span>Diferença</span><b class="${Number(d.diferenca) ? "neg" : ""}">${d.situacao === "fechado" ? esc(fmt(d.diferenca)) : "—"}</b></div></div></div><div class="dia-det hidden" id="hdet-${i}"></div></div>`).join("") : `<div class="empty">Nenhum movimento no período/filtro.</div>`;
  },
  /* Entradas em dinheiro que não pertencem a nenhum caixa (só consulta — nada é vinculado automaticamente) */
  async semCaixa(ini, fim) {
    const el = $("hSemCaixa"); if (!el) return;
    const f = S.f;
    let r;
    try { r = await rpc("entradas_sem_caixa", { p_loja_id: f.hLoja || null, p_inicio: ini, p_fim: fim, p_responsavel: f.hResp || null }); }
    catch (e) { if ($("hSemCaixa")) $("hSemCaixa").innerHTML = `<div class="banner">Valores sem caixa indisponíveis: ${esc(/Could not find the function|schema cache/i.test(e.message) ? "falta aplicar a migração 004_entradas_sem_caixa.sql" : msgErro(e))}</div>`; return; }
    if (S.tab !== "historico" || !$("hSemCaixa")) return;
    // se o filtro for "situação do caixa", o conceito não se aplica (não há caixa): mantém a seção, mas avisa
    $("hSemCaixa").innerHTML = `<div class="card"><h3>💵 Valores não vinculados a caixa</h3>
      <div class="banner">Vendas em <b>dinheiro</b> feitas sem caixa aberto. Elas <b>não</b> entram no esperado de nenhum caixa e não são vinculadas automaticamente a nenhum caixa.${f.hSit ? " (O filtro de situação do caixa não se aplica a esta seção.)" : ""}</div>
      ${r.quantidade ? `<div class="kpi-grid"><div class="kpi warn"><div class="v">${esc(fmt(r.total))}</div><div class="l">Total sem caixa no período</div></div><div class="kpi"><div class="v">${r.quantidade}</div><div class="l">venda(s)</div></div></div>
      ${r.por_dia.map(d => `<div class="list-row"><div class="grow"><b>${esc(fmtD(d.dia))}</b> · ${esc(d.loja_nome)}<small>${d.quantidade} venda(s)</small></div><b>${esc(fmt(d.total))}</b></div>`).join("")}
      <label>Vendas</label>${r.itens.map(x => `<div class="list-row"><div class="grow">${esc(fmtDT(x.criado_em))} · ${esc(x.loja_nome)}<small>${esc(x.responsavel || "—")}</small></div><b>${esc(fmt(x.valor))}</b></div>`).join("")}` : `<div class="empty">Nenhum valor sem caixa no período ✅</div>`}</div>`;
  },
  async dia(i, el) {
    const d = (S.hDias || [])[i], box = $("hdet-" + i); if (!d || !box) return;
    if (!box.classList.contains("hidden")) { box.classList.add("hidden"); return; }
    box.classList.remove("hidden"); box.innerHTML = `<div class="empty">Carregando…</div>`;
    try {
      const x = await rpc("detalhe_dia_financeiro", { p_loja_id: d.loja_id, p_dia: d.dia });
      box.innerHTML = `${x.caixas.map(c => `<div class="list-row click" data-a="cxDetalhe" data-id="${esc(c.id)}"><div class="grow"><b>Caixa ${esc(c.status)}</b><small>${esc(c.aberto_por_nome || "—")} · abriu ${esc(fmtDT(c.aberto_em))} com ${esc(fmt(c.saldo_inicial))}${c.status === "fechado" ? ` · contou ${esc(fmt(c.valor_conferido))} (esperado ${esc(fmt(c.esperado_dinheiro))}, diferença ${esc(fmt(c.diferenca))})` : ""}</small></div><span style="color:var(--muted)">›</span></div>`).join("")}
        <label>Movimentações do caixa</label>${x.movimentos.length ? x.movimentos.map(m => `<div class="list-row"><span class="tag ${m.sentido > 0 ? "entrada" : "saida"}">${esc(TIPOS_MOV[m.tipo] || m.tipo)}</span><div class="grow">${esc(m.categoria)} · ${esc(MEIOS[m.meio] || m.meio)}<small>${esc(fmtDT(m.criado_em))} · ${esc(m.criado_por_nome || "—")}${m.observacao ? " · " + esc(m.observacao) : ""}</small></div><b>${m.sentido > 0 ? "+" : "−"}${esc(fmt(m.valor))}</b></div>`).join("") : `<div class="empty">Nenhuma.</div>`}
        <label>Financeiro (vendas, despesas, estornos)</label>${x.lancamentos.length ? x.lancamentos.map(l => { const pos = Number(l.efeito) > 0, orig = { venda: "venda", estorno_venda: "estorno de venda", pagamento: "pagamento de conta", estorno_pagamento: "estorno de pagamento", conta: "conta (lançamento antigo)", rateio_pagamento: "pagamento externo de conta compartilhada", rateio_estorno: "estorno de pagamento de conta compartilhada" }[l.origem] || l.origem; return `<div class="list-row"><span class="tag ${pos ? "entrada" : "saida"}">${pos ? "ENTRADA" : "SAÍDA"}</span><div class="grow">${esc(l.descricao || l.categoria)}<small>Origem: ${esc(orig)} · ${esc(l.categoria)}${l.forma_pagamento ? " · " + esc(l.forma_pagamento) : ""} · ${esc(fmtDT(l.data_ref))}</small></div><b>${pos ? "+" : "−"}${esc(fmt(l.valor))}</b></div>`; }).join("") : `<div class="empty">Nenhum.</div>`}`;
    } catch (e) { box.innerHTML = `<div class="empty">${esc(msgErro(e))}</div>`; }
  },
};

  finForm: () => Views.financeiro.form(), finSalvar: (id, b) => Views.financeiro.salvar(b), finCsv: () => Views.financeiro.csv(),
  finPeriodo: (id) => { S.f.finPeriodo = id; Views.financeiro.render().catch(e => toast(msgErro(e), true)); },
  finDetalhe: (id) => Views.financeiro.detalhe(id).catch(e => toast(msgErro(e), true)), finVoltar: (id) => Views.financeiro.detalhe(id).catch(e => toast(msgErro(e), true)),
  finPagForm: (id) => Views.financeiro.pagForm(id), finPagSalvar: (id, b) => Views.financeiro.pagSalvar(id, b),
  finEstornarForm: (id) => Views.financeiro.estornarForm(id), finEstornarOk: (id, b) => Views.financeiro.estornarOk(id, b),
  finCancelarForm: (id) => Views.financeiro.cancelarForm(id), finCancelarOk: (id, b) => Views.financeiro.cancelarOk(id, b),
  finAnexar: (id) => Views.financeiro.escolherArquivo(id), finTentar: (id, b) => Views.financeiro.registrarArq(id, b), finBaixar: (id) => Views.financeiro.baixar(id),
  finEnvio: (id, b) => Views.financeiro.confirmarEnvio(id, b),
  ratEscopo: (id) => { S.f.ratEscopo = id; Views.financeiro.render().catch(e => toast(msgErro(e), true)); },
  ratNovo: () => Views.rateios.novo(false).catch(e => toast(msgErro(e), true)), ratRevisar: () => Views.rateios.novo(true).catch(e => toast(msgErro(e), true)),
  ratPrevia: (id, b) => Views.rateios.previa(b), ratCriar: (id, b) => Views.rateios.criar(b),
  ratDetalhe: (id) => Views.rateios.detalhe(id).catch(e => toast(msgErro(e), true)), ratVoltar: (id) => Views.rateios.detalhe(id).catch(e => toast(msgErro(e), true)),
  ratPagForm: (id) => Views.rateios.pagForm(id), ratPagSalvar: (id, b) => Views.rateios.pagSalvar(id, b),
  ratReembForm: (id) => Views.rateios.reembForm(id), ratReembSalvar: (id, b) => Views.rateios.reembSalvar(id, b),
  ratEstPagForm: (id) => Views.rateios.estForm(id, "pag"), ratEstPagOk: (id, b) => Views.rateios.estOk(id, "pag", b),
  ratEstReembForm: (id) => Views.rateios.estForm(id, "reemb"), ratEstReembOk: (id, b) => Views.rateios.estOk(id, "reemb", b),

  finMarcaAntiga: (id, b) => busy(b, async () => { await rpc("marcar_comprovante_enviado", { p_id: id }); toast("Marcação antiga registrada"); await Views.financeiro.detalhe(id); }),

};
document.addEventListener("click", ev => {
  if (ev.target === $("modalOv")) return closeModal();
  const el = ev.target.closest("[data-a]"); if (!el || el.disabled) return;
  const fn = Act[el.dataset.a]; if (fn) fn(el.dataset.id, el);
});
document.addEventListener("input", ev => {
  const id = ev.target.id;
  if (ev.target.closest && ev.target.closest("#ratForm")) { Views.rateios.invalida(); return; }
  if (id === "estBusca") { S.f.estBusca = ev.target.value; Views.estoque.update(); }
  else if (id === "vBusca") { S.f.vendaBusca = ev.target.value; Views.venda.resultados(); }       // só a lista muda — o campo nunca é recriado
  else if (id === "cliBusca") { S.f.cliBusca = ev.target.value; Views.clientes.update(); }
  else if (id === "vDesc") { Views.venda.carrinho(); const d = $("vDesc"); d.focus(); d.setSelectionRange(d.value.length, d.value.length); }
  else if (id === "vCliNome") {
    const c = S.clientes.find(x => x.nome === ev.target.value);
    if (c) { $("vCliTel").value = c.telefone || ""; $("vCliEnd").value = c.endereco || ""; }
  }
  else if (id === "fcVal") Views.caixa.atualizaDif();
  else if (id === "waPreco" || id === "waQtd" || id === "waSabores") { S.f[id] = ev.target.checked; Views.whats.render(); }
});
document.addEventListener("change", ev => {
  const id = ev.target.id;
  if (ev.target.classList && ev.target.classList.contains("arqRat")) { const f = ev.target.files[0]; ev.target.value = ""; Views.rateios.anexar(ev.target.dataset.mov, ev.target.dataset.kind, f).catch(e => toast(msgErro(e), true)); return; }
  if (ev.target.closest && ev.target.closest("#ratForm")) { if (id === "rtMetodo" || (ev.target.classList && ev.target.classList.contains("rtLoja"))) Views.rateios.ajustaEntradas(); Views.rateios.invalida(); return; }
  if (ev.target.classList && ev.target.classList.contains("arqInput")) { const f = ev.target.files[0]; ev.target.value = ""; Views.financeiro.anexar(ev.target.dataset.pag, f).catch(e => toast(msgErro(e), true)); return; }
  if (id === "lJaPaga") { $("lPagBox").classList.toggle("hidden", !ev.target.checked); return; }
  if (id === "waPreco" || id === "waQtd" || id === "waSabores") { S.f[id] = ev.target.checked; Views.whats.render(); }
  else if (["hLoja", "hPeriodo", "hResp", "hSit"].includes(id)) { S.f[id] = ev.target.value; Views.historico.update().catch(e => toast(msgErro(e), true)); }
});
document.addEventListener("keydown", ev => { if (ev.key === "Escape" && modalOpen()) closeModal(); });
document.addEventListener("visibilitychange", async () => {
  if (document.visibilityState !== "visible" || !S.loja) return;
  try { await DB.estoque(); await App.atualizar(); } catch (e) {}
});

/* ───────── início ───────── */
$("loginForm").addEventListener("submit", Auth.login);
$("loginFoot").textContent = "Servidor: " + new URL(SUPABASE_URL).hostname.split(".")[0];
(async () => {
  try { const { data: { session } } = await sb.auth.getSession(); if (session) await App.boot(); } catch (e) { /* mostra login */ }
})();
</script>
